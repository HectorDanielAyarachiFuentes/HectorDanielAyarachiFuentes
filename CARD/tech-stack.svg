<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Tech Stack">
  <defs>
    <!-- Ultra-fine minimalist grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    
    <!-- Premium glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="headerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 26px; font-weight: 800; fill: #ffffff; letter-spacing: -1px; }
    .section-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #a1a1aa; letter-spacing: 2px; text-transform: uppercase; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 13px; font-weight: 500; fill: #e4e4e7; }
    .level-bar-bg { fill: #27272a; rx: 1; }
    .level-bar-fill { rx: 1; }
    
    /* Animation for the progress bars */
    @keyframes loadBar {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Deep space black background -->
  <rect width="900" height="440" fill="#050505"/>
  <rect width="900" height="440" fill="url(#grid)"/>

  <!-- Main Title -->
  <text x="50" y="60" class="title">Tech Stack &amp; Arsenal</text>
  <rect x="50" y="80" width="300" height="2" fill="url(#headerLine)"/>
  <rect x="350" y="80" width="500" height="1" fill="#27272a"/>

  <!-- ================= FRONTEND & DISEÑO ================= -->
  <g transform="translate(50, 115)">
    <text x="0" y="15" class="section-title">Frontend &amp; Diseño</text>
    
    <!-- JavaScript -->
    <g transform="translate(0, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#facc15" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">JavaScript</text>
      <!-- Skill Level Bar -->
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="58" height="2" class="level-bar-fill" fill="#facc15"/>
    </g>

    <!-- React -->
    <g transform="translate(135, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#61dafb" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">React</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="52" height="2" class="level-bar-fill" fill="#61dafb"/>
    </g>

    <!-- Vue.js -->
    <g transform="translate(270, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#42b883" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">Vue.js</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="40" height="2" class="level-bar-fill" fill="#42b883"/>
    </g>

    <!-- HTML5 -->
    <g transform="translate(405, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#f97316" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">HTML5</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="62" height="2" class="level-bar-fill" fill="#f97316"/>
    </g>

    <!-- CSS3 -->
    <g transform="translate(540, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#3b82f6" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">CSS3</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="60" height="2" class="level-bar-fill" fill="#3b82f6"/>
    </g>

    <!-- Bootstrap -->
    <g transform="translate(675, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#a855f7" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">Bootstrap</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="50" height="2" class="level-bar-fill" fill="#a855f7"/>
    </g>
  </g>

  <!-- ================= BACKEND & DATOS ================= -->
  <g transform="translate(50, 220)">
    <text x="0" y="15" class="section-title">Backend &amp; Datos</text>
    
    <!-- Python -->
    <g transform="translate(0, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#eab308" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">Python</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="55" height="2" class="level-bar-fill" fill="#eab308"/>
    </g>

    <!-- Java -->
    <g transform="translate(135, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#ea580c" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">Java</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="40" height="2" class="level-bar-fill" fill="#ea580c"/>
    </g>

    <!-- Node.js -->
    <g transform="translate(270, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#22c55e" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">Node.js</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="52" height="2" class="level-bar-fill" fill="#22c55e"/>
    </g>

    <!-- MySQL -->
    <g transform="translate(405, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#0ea5e9" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">MySQL</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="45" height="2" class="level-bar-fill" fill="#0ea5e9"/>
    </g>
  </g>

  <!-- ================= HERRAMIENTAS & DEVOPS ================= -->
  <g transform="translate(50, 325)">
    <text x="0" y="15" class="section-title">Herramientas &amp; DevOps</text>
    
    <!-- Git -->
    <g transform="translate(0, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#ef4444" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">Git</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="58" height="2" class="level-bar-fill" fill="#ef4444"/>
    </g>

    <!-- GitHub -->
    <g transform="translate(135, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#ffffff" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">GitHub</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="62" height="2" class="level-bar-fill" fill="#ffffff"/>
    </g>

    <!-- VS Code -->
    <g transform="translate(270, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#3b82f6" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">VS Code</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="62" height="2" class="level-bar-fill" fill="#3b82f6"/>
    </g>

    <!-- Linux -->
    <g transform="translate(405, 35)">
      <rect width="120" height="42" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#facc15" filter="url(#glow)"/>
      <text x="35" y="25" class="badge-text">Linux</text>
      <rect x="35" y="32" width="65" height="2" class="level-bar-bg"/>
      <rect x="35" y="32" width="45" height="2" class="level-bar-fill" fill="#facc15"/>
    </g>
  </g>

  <!-- Pulsing ambient glow in the background to match banner -->
  <circle cx="800" cy="220" r="150" fill="#8b5cf6" opacity="0.05" filter="url(#glow)">
    <animate attributeName="r" values="130;170;130" dur="8s" repeatCount="indefinite"/>
  </circle>

</svg>
