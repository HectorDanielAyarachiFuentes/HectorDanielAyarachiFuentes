<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <defs>
    <!-- Modern subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    
    <!-- Soft glow for chart line -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Premium gradient line (Vercel/Stripe style) -->
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/> <!-- Blue 500 -->
      <stop offset="50%" stop-color="#8b5cf6"/> <!-- Violet 500 -->
      <stop offset="100%" stop-color="#ec4899"/> <!-- Pink 500 -->
    </linearGradient>

    <linearGradient id="chartFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .greeting { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; fill: #a1a1aa; }
    .name { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 52px; font-weight: 800; fill: #ffffff; letter-spacing: -2.5px; }
    .last-name { fill: #71717a; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #71717a; letter-spacing: 3px; text-transform: uppercase; }
    .pill { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #e4e4e7; }
  </style>

  <!-- Deep black background for ultimate contrast -->
  <rect width="900" height="250" fill="#050505"/>
  <rect width="900" height="250" fill="url(#grid)"/>

  <!-- Top accent bar -->
  <rect width="900" height="2" fill="url(#lineGlow)"/>

  <!-- Right Side: Professional Data Visualization -->
  <g transform="translate(500, 45)">
    <!-- Chart Area Fill -->
    <path d="M 0 120 C 50 120, 80 60, 120 80 C 160 100, 200 30, 250 50 C 300 70, 330 20, 350 10 L 350 160 L 0 160 Z" fill="url(#chartFade)"/>
    <!-- Chart Spline -->
    <path d="M 0 120 C 50 120, 80 60, 120 80 C 160 100, 200 30, 250 50 C 300 70, 330 20, 350 10" fill="none" stroke="url(#lineGlow)" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Data points -->
    <circle cx="120" cy="80" r="4.5" fill="#050505" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="250" cy="50" r="4.5" fill="#050505" stroke="#d946ef" stroke-width="2"/>
    
    <!-- Pulsing target point -->
    <circle cx="350" cy="10" r="6" fill="#ec4899" opacity="0.3">
      <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="10" r="4.5" fill="#050505" stroke="#ec4899" stroke-width="2"/>
  </g>

  <!-- Left Side: Clean Typography -->
  
  <!-- Terminal Prompt -->
  <g transform="translate(48, 45)">
    <rect width="165" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="82.5" y="18" text-anchor="middle" class="greeting">~ $ hello_world.sh</text>
  </g>

  <!-- Name -->
  <text x="46" y="128" class="name">Hector Daniel</text>
  <text x="46" y="176" class="name last-name">Ayarachi Fuentes</text>

  <!-- Subtitle -->
  <text x="48" y="215" class="subtitle">Software Developer • AI &amp; Web Enthusiast</text>

  <!-- Sleek Status Badges -->
  <g transform="translate(485, 195)">
    <!-- Badge 1: Full Stack -->
    <rect x="0" y="0" width="105" height="30" rx="15" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#3b82f6"/>
    <text x="29" y="19" class="pill">Full Stack</text>
    
    <!-- Badge 2: AI / ML -->
    <rect x="115" y="0" width="85" height="30" rx="15" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <circle cx="131" cy="15" r="4" fill="#8b5cf6"/>
    <text x="144" y="19" class="pill">IA / ML</text>
    
    <!-- Badge 3: Open Source -->
    <rect x="210" y="0" width="115" height="30" rx="15" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <circle cx="226" cy="15" r="4" fill="#ec4899"/>
    <text x="239" y="19" class="pill">Open Source</text>
  </g>
</svg>
