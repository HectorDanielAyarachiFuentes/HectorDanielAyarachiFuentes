<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190">
  <defs>
    <!-- Vibrant Purple-Pink Gradient Background (matching the photo!) -->
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0a45"/> <!-- Deep royal purple -->
      <stop offset="50%" stop-color="#5c156d"/> <!-- Vibrant violet -->
      <stop offset="100%" stop-color="#801559"/> <!-- Magenta/Pink -->
    </linearGradient>

    <!-- Golden Crown Title Gradient -->
    <linearGradient id="titleG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffb142"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowWhite">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="darkShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="bigBlur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="190" fill="url(#bgG)"/>

  <!-- Colorful ambient light blobs -->
  <ellipse cx="200" cy="95" rx="180" ry="100" fill="#ff1493" opacity="0.3" filter="url(#bigBlur)">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="700" cy="95" rx="200" ry="110" fill="#ff69b4" opacity="0.3" filter="url(#bigBlur)">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Animated Floating Hearts (Red and White like the photo) -->
  <g filter="url(#softShadow)">
    <!-- Red Hearts -->
    <text x="50" y="150" font-size="28" fill="#ff003c"><animate attributeName="y" values="150;130;150" dur="4s" repeatCount="indefinite"/>❤</text>
    <text x="150" y="50" font-size="24" fill="#ff003c"><animate attributeName="y" values="50;35;50" dur="5s" repeatCount="indefinite"/>❤</text>
    <text x="250" y="170" font-size="32" fill="#ff003c"><animate attributeName="y" values="170;150;170" dur="4.5s" repeatCount="indefinite"/>❤</text>
    <text x="700" y="60" font-size="26" fill="#ff003c"><animate attributeName="y" values="60;45;60" dur="3.5s" repeatCount="indefinite"/>❤</text>
    <text x="820" y="140" font-size="30" fill="#ff003c"><animate attributeName="y" values="140;120;140" dur="4.2s" repeatCount="indefinite"/>❤</text>
    <text x="60" y="70" font-size="18" fill="#ff003c"><animate attributeName="y" values="70;55;70" dur="3.8s" repeatCount="indefinite"/>❤</text>
    <text x="850" y="50" font-size="22" fill="#ff003c"><animate attributeName="y" values="50;35;50" dur="5.5s" repeatCount="indefinite"/>❤</text>
    
    <!-- White Hearts -->
    <text x="100" y="110" font-size="20" fill="#ffffff"><animate attributeName="y" values="110;95;110" dur="4.8s" repeatCount="indefinite"/>❤</text>
    <text x="200" y="140" font-size="18" fill="#ffffff"><animate attributeName="y" values="140;125;140" dur="3.6s" repeatCount="indefinite"/>❤</text>
    <text x="320" y="60" font-size="24" fill="#ffffff"><animate attributeName="y" values="60;45;60" dur="4.1s" repeatCount="indefinite"/>❤</text>
    <text x="650" y="150" font-size="20" fill="#ffffff"><animate attributeName="y" values="150;135;150" dur="5.2s" repeatCount="indefinite"/>❤</text>
    <text x="760" y="80" font-size="28" fill="#ffffff"><animate attributeName="y" values="80;60;80" dur="4.4s" repeatCount="indefinite"/>❤</text>
    <text x="880" y="110" font-size="16" fill="#ffffff"><animate attributeName="y" values="110;95;110" dur="3.9s" repeatCount="indefinite"/>❤</text>
  </g>

  <!-- ✨ Twinkling Sparkles -->
  <g fill="#ffffff" filter="url(#glowWhite)">
    <circle cx="120" cy="40" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="110" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="50" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="160" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 🐾 Golden Paw Prints -->
  <g transform="translate(60, 80)" opacity="0.8" filter="url(#softShadow)">
    <ellipse cx="0" cy="18" rx="14" ry="11" fill="#ffd700"/>
    <circle cx="-11" cy="6" r="5.5" fill="#ffd700"/>
    <circle cx="-3" cy="2" r="5.5" fill="#ffd700"/>
    <circle cx="6" cy="2" r="5.5" fill="#ffd700"/>
    <circle cx="13" cy="7" r="5.5" fill="#ffd700"/>
  </g>
  
  <g transform="translate(810, 80)" opacity="0.8" filter="url(#softShadow)">
    <ellipse cx="0" cy="18" rx="14" ry="11" fill="#ffd700"/>
    <circle cx="-11" cy="6" r="5.5" fill="#ffd700"/>
    <circle cx="-3" cy="2" r="5.5" fill="#ffd700"/>
    <circle cx="6" cy="2" r="5.5" fill="#ffd700"/>
    <circle cx="13" cy="7" r="5.5" fill="#ffd700"/>
  </g>

  <!-- ═══════ CENTRAL TEXT ═══════ -->
  <!-- Deep shadow behind main title for contrast -->
  <text x="450" y="96" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="48" font-weight="900" fill="#000000" opacity="0.8" filter="url(#darkShadow)">🐾 DULCE REINA 🐾</text>

  <!-- Main Title -->
  <text x="450" y="96" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="48" font-weight="900" fill="url(#titleG)" filter="url(#glowGold)">🐾 DULCE REINA 🐾</text>

  <!-- Spanish Subtitles -->
  <text x="450" y="135" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="15" font-weight="800" fill="#ffdd44" letter-spacing="6" filter="url(#darkShadow)">LA VERDADERA JEFA DEL CÓDIGO</text>

  <text x="450" y="165" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="14" font-weight="700" fill="#ffffff" font-style="italic" filter="url(#darkShadow)">
    "Experta en mimos, lengüetazos y encontrar bugs en producción" 💖
  </text>
</svg>
